# PR triage (frostyard/core ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md): this caller runs core's
# reusable pr-triage workflow on every pull request. It runs on pull_request_target so the trusted caller
# executes, and it checks out nothing: no code from the pull request runs. It is not a required check. The job
# id must stay pr-triage. The repository must have the risk:high label, or the levels step fails; a missing
# level:L1 to level:L4 label gives only a warning. The reusable workflow is pinned to a core commit (ADR-0021).
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@c996ea3fb54bcf1a3c621113522213702a7673e2
