# The checks use Pi Pocket's packages, as the README's "Develop" section says: node_modules is a link to a Pi Pocket
# checkout's. Here we clone the public Pi Pocket repository at tag v0.27.0 (the release the team's server runs) into
# the runner's temporary folder, install its dependencies, and link them.
# Then the job runs the gate, make ci. Actions are pinned by commit SHA, and the token can only read (frostyard/core ADR-0021).
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out this repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # The corrections check compares .memory/corrections.jsonl with the PR base, so the base
                  # commit must be in the clone.
                  fetch-depth: 0

            - name: Install the pinned Node (mise.toml, mise.lock)
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              with:
                  install: true
                  install_args: node
                  cache: true

            - name: Clone Pi Pocket v0.27.0
              run: git clone --depth 1 --branch v0.27.0 https://github.com/TannerMidd/pi-pocket.git "$RUNNER_TEMP/pi-pocket"

            - name: Install Pi Pocket dependencies
              working-directory: ${{ runner.temp }}/pi-pocket
              run: npm ci

            - name: Link node_modules to the Pi Pocket checkout
              run: ln -s "$RUNNER_TEMP/pi-pocket/node_modules" node_modules

            - name: Run the gate (template gate, check, tests, format check, corrections)
              run: make ci BASE="$BASE"
              env:
                  BASE: ${{ github.event.pull_request.base.sha || '' }}
